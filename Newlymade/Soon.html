<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <style>
        body {
            text-align: center;
            transition: background-color 0.5s;
        }
        .palette {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px;
        }
        .color-box {
            width: 50px;
            height: 50px;
            cursor: pointer;
          </style>
</head>
<body>
    <h2>Colors to Change Background</h2>
    <div class="palette">
        <div class="color-box" style="background-color: red;" onmouseover="changeBg('red')"></div>
        <div class="color-box" style="background-color: blue;" onmouseover="changeBg('blue')"></div>
        <div class="color-box" style="background-color: green;" onmouseover="changeBg('green')"></div>
        <div class="color-box" style="background-color: orange;" onmouseover="changeBg('orange')"></div>
    </div>

    <script>
        function changeBg(color) {
            document.body.style.backgroundColor = color;
        }
    </script>
</body>
</html>
